<VirtualHost *:80>
    ServerName shopp.test
    ServerAlias shopp.localhost
    DocumentRoot /home/tycoonmudegu/projects/Shopp.ke/public

    <Directory /home/tycoonmudegu/projects/Shopp.ke/public>
